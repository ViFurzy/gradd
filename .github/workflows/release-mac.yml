name: Release macOS

# Tag push: build and upload mac assets to the (draft) release.
# Release published: update the Homebrew tap (assets are public only after publish).
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$PKG"
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      # SIGNING SWITCH. When Apple secrets exist:
      #  (a) drop `-c.mac.identity=null` below;
      #  (b) add step env CSC_LINK + CSC_KEY_PASSWORD (Developer ID Application .p12) and either
      #      APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, or
      #      APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER, all from secrets;
      #  (c) set `notarize: true` in electron-builder.yml (electron-builder 26 notarizes
      #      natively from those env vars, no afterSign hook or @electron/notarize needed);
      #  (d) remove the cask postflight and enable auto_updates in packaging/homebrew/gradd.rb.template.
      - name: Build unsigned universal app
        run: npx electron-builder --mac --publish never -c.mac.identity=null

      - run: node scripts/verify-release.cjs --mac

      # Blockmaps are not uploaded; add them if delta mac updates are wanted after signing.
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DMG="dist/gradd-app-${VERSION}-universal.dmg"
          ZIPS=(dist/*-"${VERSION}"-universal-mac.zip)
          if [ "${#ZIPS[@]}" -ne 1 ] || [ ! -f "${ZIPS[0]}" ]; then
            echo "::error::Expected exactly one mac zip for ${VERSION}"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" "$DMG" "${ZIPS[0]}" dist/latest-mac.yml --clobber

  tap:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render cask from published DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir dl
          if ! gh release download "$TAG" --pattern "gradd-app-${VERSION}-universal.dmg" --dir dl; then
            echo "::notice::No mac DMG on release $TAG, skipping Homebrew tap update"
            echo "SKIP_TAP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          SHA=$(sha256sum "dl/gradd-app-${VERSION}-universal.dmg" | awk '{print $1}')
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA}/" packaging/homebrew/gradd.rb.template > gradd.rb
          if command -v ruby >/dev/null 2>&1; then ruby -c gradd.rb; fi
          cat gradd.rb
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ "${SKIP_TAP:-}" = "1" ]; then exit 0; fi
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set, skipping Homebrew tap update"
            exit 0
          fi
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ViFurzy/homebrew-gradd.git" tap
          mkdir -p tap/Casks
          cp gradd.rb tap/Casks/gradd.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gradd.rb
          if git diff --cached --quiet; then
            echo "::notice::cask unchanged"
            exit 0
          fi
          git commit -m "gradd ${VERSION}"
          git push
